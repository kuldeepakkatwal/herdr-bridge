<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Herdr">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161618" media="(prefers-color-scheme: dark)">
<title>Herdr</title>
<link rel="manifest" href="web/manifest.webmanifest">
<link rel="icon" href="web/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="web/icon-180.png">
<link rel="stylesheet" href="web/app.css">
</head>
<body>
<div id="app">
  <aside id="drawer" aria-label="Agents">
    <div class="drawer-head">Herdr</div>
    <nav id="agents"></nav>
  </aside>
  <div id="scrim"></div>
  <main id="main">
    <header id="top">
      <button id="menuBtn" class="icon" aria-label="Agents">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      </button>
      <div class="titles"><div id="title">Herdr</div><div id="sub"></div></div>
      <span id="conn" class="pill offline" hidden>Offline</span>
      <span id="pill" class="pill" hidden></span>
    </header>
    <div class="listwrap">
      <section id="list" role="log" aria-live="polite">
        <div class="col">
          <div id="msgs"></div>
          <div id="pending"></div>
          <div id="live" hidden>
            <pre id="liveLines"></pre>
            <div id="working"><span class="dots"><i></i><i></i><i></i></span> Claude is working<span id="workingText"></span></div>
          </div>
        </div>
      </section>
      <button id="newPill" hidden>↓ New messages</button>
    </div>
    <footer id="bottom">
      <div class="col">
        <div id="menu" hidden></div>
        <div id="keys"></div>
        <form id="composer">
          <textarea id="box" rows="1" placeholder="Message Claude" enterkeyhint="send" autocomplete="off"></textarea>
          <button id="send" type="submit">Send</button>
        </form>
      </div>
    </footer>
  </main>
</div>
<div id="toast" role="status" hidden></div>
<script src="web/marked.min.js"></script>
<script src="web/app.js"></script>
</body>
</html>
